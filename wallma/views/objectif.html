<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../static/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <script type="module" src="/src/main.js"></script>






  <title>Dashboard</title>
</head>

<body class="d-flex flex-nowrap ">

  <!-- Barre de navigation verticale -->
  <header class="d-none d-lg-flex flex-column flex-shrink-0 p-3  bg-body-tertiary" style="width: 300px">

  </header>



  <!-- Espace de travail -->
  <main class="container-fluid flex-grow-1 bg-body-secondary overflow-auto pe-2 ps-2  ">


    <!-- Barre d'acces rapide -->
    <section id="work-header" class="row position-sticky top-0  pt-2  pb-2 ps-md-2 pe-md-2  z-1  g-0 bg-body-secondary">

        <div class="col  justify-content-between   d-flex flex-row align-items-center p-0">

        <nav class="col d-flex flex-row gap-4 align-items-center  justify-content-start">

         
          <!-- Menu invisible -->
          
        </nav>
        
        
      </div>





     
    </section>
     <span class=" d-md-block fs-4 fw-medium ms-2" >Objectif</span>

    <!--  <section id="welcome" class="row g-0 pb-2 pt-4">
            <h1 class="p-0 m-0">Bon retour, Off1805</h1>

        </section>-->

    <section class="row    d-flex justify-content-between flex-column align-items-center g-0 m-2 ">


      <div id="listeObjectifs" class="container-fluid p-0 m-0 mt-2 " style="max-width: 800px;">

        <div class="container-fluid p-0 align-items-center justify-content-center h-auto">

          <div class="row">
            <div class="col-md-6 mt-2">
              <p>Retracer facilement l'historique de vos objectifs</p>
            </div>
            <div class="col-md-6 mt-2">
              <div class="d-flex  justify-content-end align-items-start">
                <button type="button" id="ajouter" class="btn btn-outline-primary mb-2 m " data-bs-toggle="modal"
                  data-bs-target="#modifier"> Nouvel objectif </button>
              </div>
            </div>
          </div>
          <div class="row" id="search-bar">
            <div class="input-group my-2">
              <span class="input-group-text " id="search-icon">
                <i class="bi bi-search"></i>
              </span>
              <input type="text" class="form-control " placeholder="Rechercher..." aria-describedby="search-icon"
                id="searchInput">
            </div>
          </div>

        
          <ul class="nav nav-pills  d-flex align-items-center  gap-3 mb-3 mt-4" role="tablist" id="choixCategorie">
            <li class="nav-item" role="presentation">
              <div class=" nav-link active rounded-4  px-3 py-1 filtreCathegories" data-id="Tout" data-bs-toggle="tab"
                data-bs-target="#stats-pane" type="button" role="tab" aria-controls="stats-pane" aria-selected="false"
                >Tout</div>
            </li>
             <li class="nav-item" role="presentation">
              <div class=" nav-link  rounded-4  px-3 py-1 filtreCathegories" data-id="En cours" data-bs-toggle="tab"
                data-bs-target="#stats-pane" type="button" role="tab" aria-controls="stats-pane" aria-selected="false"
                >En cours</div>
            </li>
             <li class="nav-item" role="presentation">
              <div class=" nav-link  rounded-4  px-3 py-1 filtreCathegories" data-id="Archever" data-bs-toggle="tab"
                data-bs-target="#stats-pane" type="button" role="tab" aria-controls="stats-pane" aria-selected="false"
                >Archeve</div>
            </li>
             <li class="nav-item" role="presentation">
              <div class=" nav-link  rounded-4  px-3 py-1 filtreCathegories" data-id="Abandonne" data-bs-toggle="tab"
                data-bs-target="#stats-pane" type="button" role="tab" aria-controls="stats-pane" aria-selected="false"
                >Abandonne</div>
            </li>
            <!-- <li class="nav-item" role="presentation">
            <div class="nav-link rounded-4 px-3 py-1" id="profil-tab" data-bs-toggle="tab" data-bs-target="#profil-pane"
              type="button" role="tab" aria-controls="profil-pane" aria-selected="true">Salaire</div>
          </li> -->
          </ul>

          <div id="Liste" class="row"></div>

        </div>

      </div>





      <!-- Modal -->
      <div class="modal fade " id="modifier" tabindex="-1" aria-labelledby="monModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">

            <div class="modal-header">
              <h5 class="modal-title" id="monModalLabel">Créer un objectif</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
            </div>

            <div class="modal-body">
              <div class="mb-3">
                <label for="intitule1" class="form-label">Intitulé</label>
                <input type="text" class="form-control" id="intitule1" style="height: 35px;">
              </div>



              <div class="mb-3">
                <label for="economie1" class="form-label">Montant à économiser</label>
                <input type="number" class="form-control" id="economie1" style="height: 35px;">
              </div>

              <div class="row mb-3">
                <label class="form-label">Date</label>
                <div class="col">
                  <input type="date" class="form-control" id="jour1" placeholder="Jour" min="1" max="31"
                    style="height: 35px;">
                </div>
              </div>

              <div class="mb-3">
                <label for="exampleFormControlTextarea" class="form-label">Description</label>
                <textarea class="form-control" id="exampleFormControlTextarea" style="height: 60px;"
                  rows="3"></textarea>
              </div>

              <button id="ajouterobj" class="btn btn-primary mb-2 m-2 w-100" data-bs-dismiss="modal">Ajouter</button>

            </div>
          </div>
        </div>
      </div>


      <div class="modal fade" id="achat" tabindex="-1" aria-labelledby="monModalLabel" aria-hidden="true">

      </div>


      <div class="modal fade" id="modification" tabindex="-1" aria-labelledby="monModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">

            <div class="modal-header">
              <h5 class="modal-title" id="modifier1">Modifier Objectif</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
            </div>

            <div class="modal-body">
              <div class="mb-3">
                <label for="intitule1" class="form-label">Intitulé</label>
                <input type="text" class="form-control" id="intitule" style="height: 35px;">
              </div>


              <div class="mb-3">
                <label for="economie1" class="form-label">Montant à économiser</label>
                <input type="number" class="form-control" id="economie" style="height: 35px;">
              </div>

              <div class="row mb-3">
                <label class="form-label">Date</label>
                <div class="col">
                  <input type="date"class="form-control"id="jour" min="2024-01-01" max="2024-12-31" style="height: 35px;"
                    style="height: 35px;">
                </div>
              </div>

              <div class="mb-3">
                <label for="exampleFormControlTextarea" class="form-label">Description</label>
                <textarea class="form-control" id="exampleFormControlTextarea1" style="height: 90px;"
                  rows="3"></textarea>
              </div>
              <div class="text-center">
                <button type="button" class="btn btn-secondary m-2" data-bs-toggle="modal" data-bs-target="#achat"
                  style="width: 210px;">Annuler</button>
                <button type="button" class="btn btn-primary m-2" id="Enregistrement"
                  style="width: 210px;">Enregistrer</button>
              </div>
            </div>
          </div>

        </div>
      </div>
      <div class="modal fade" id="Montanteconomiser" tabindex="-1" aria-labelledby="monModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <h4>Avance d'argent</h4>
            <div class="mb-3">
              <label for="intitule1" class="form-label">Entrer la somme que vous avez</label>
              <input type="number" min="0" step="0.01" class="form-control" id="veuteconomiser" style="height: 30px;"
                oninput="if(this.value<0){this.value=''; document.getElementById('error-message').style.display='block';} else {document.getElementById('error-message').style.display='none';}">
              <div id="error-message" class="text-danger small mt-1" style="display: none;">Le montant ne peut pas être
                négatif.</div>
            </div>
            <div class="text-center">
              <button type="button" class="btn btn-secondary m-2" data-bs-dismiss="modal"
                style="width: 210px;">Annuler</button>
              <button type="button" class="btn btn-primary m-2" id="btnEnregistrerEconomie"
                style="width: 210px;">Enregistrer</button>
            </div>
          </div>
        </div>

      </div>

      <div class="modal fade" id="modalAfficherObj" tabindex="-1" aria-labelledby="monModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="monModalLabell">Objectif</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
            </div>

            <div class="d-flex w-auto flex-row justify-content-around align-items-start gap-3 pt-3">

              <div class="col-md-6">
                <p><strong>Intitulé</strong></p>

                <p><strong>Montant</strong></p>
                <p><strong>Taux de réalisation</strong></p>
                <p><strong>Date</strong></p>
                <p><strong>Statut</strong></p>
              </div>

              <div class="col-md-6">
                <p id="Intitule2"></p>

                <p id="Economie2"></p>
                <p id="pourcent"></p>
                <p id="Jour2"></p>
                <p id="statut"></p>
              </div>

            </div>

            <div class="mb-3 mt-3">
              <label for="textarea" class="form-label">Description</label>
              <textarea class="form-control" id="textarea" style="height: 90px;" readonly></textarea>
            </div>

            <div class="text-center">
              <button type="button" class="btn btn-secondary m-2" data-bs-dismiss="modal" style="width: 200px;">
                Fermer
              </button>
              <button type="button" class="btn btn-primary m-2" id="modif" data-bs-toggle="modal"
                data-bs-target="#modification" style="width: 200px;">
                Modifier
              </button>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>
  <script type="module" src="/static/js/PageController/ObjectifController.js"></script>
</body>

</html>
