<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/static/js/PageController/signInController.js"> </script>
    <link rel="stylesheet" href="/static/css/style.css">
    <title>Sign in</title>
</head>

<body style="height: 100vh;">
    <main class="container-fluid h-100 bg-body-secondary">
        <div class="row h-100">
            <div class="col   h-100">
                <section class="container-fluid  h-100 d-flex align-items-center justify-content-center flex-column"
                    style="max-width: 400px;">
                    <img src="../assets/logo/logo_filled.png" class="img-fluid text-center mx-auto d-block mb-4"
                        width="80px">
                    <h3 class="text-center mb-3" data-i18n="signIn.create"></h3>
                    <form class="mb-4 w-100 needs-validation" id="signInForm" novalidate>
                        <input type="text" id="nom" class="form-control  rounded-2 p-2 p-xl-3 mb-3"
                            placeholder="Nom utilisateur" required>
                        <input type="email" id="email" class="form-control  rounded-2 mb-3" placeholder="Email"
                            required>
                        <input type="password" id="password" class="form-control rounded-2 mb-3"
                            placeholder="Mot de passe" required pattern="^.{8,}$">
                        <div class="invalid-feedback mb-3" id="otherError" data-i18n="signIn.userAlreadyExist">
                        </div>
                        <button id="btn" type="submit" class="btn btn-primary w-100 rounded-2" style="height: 50px;"
                            data-i18n="signIn.btnCreateAccount"></button>
                    </form>
                    <div class="text-center">
                        <h6 class="text-center" data-i18n="signIn.alreadyAccount"></h6>
                        <a href="login.html" class="text-decoration-none" data-i18n="signIn.linkLogin"></a>
                    </div>
                </section>
            </div>
        </div>
    </main>
</body>

</html>
