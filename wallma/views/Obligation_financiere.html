<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../static/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <title>Dashboard</title>
</head>

<body class="d-flex flex-nowrap ">

  <!-- Barre de navigation verticale -->
  <header class="d-none d-lg-flex flex-column flex-shrink-0 p-3  bg-body-tertiary" style="width: 300px">



  </header>


  <!-- Espace de travail -->
  <main class="container-fluid flex-grow-1 bg-body-secondary overflow-auto pe-3 ps-3 ">


    <!-- Barre d'acces rapide -->
    <section id="work-header" class="row position-sticky top-0  pt-2  pb-2 ps-md-2 pe-md-2  z-1  g-0 bg-body-secondary">

      <div class="col  justify-content-between   d-flex flex-row align-items-center p-0">

        <nav class="col d-flex flex-row gap-4 align-items-center  justify-content-start">

         
          <!-- Menu invisible -->
          
        </nav>
       
        
      </div>
    </section>
      <span class=" d-md-block fs-4 fw-medium" data-i18n="obligation.Obligation financiere"></span>
    <section class="row    d-flex justify-content-between flex-column align-items-center g-0 m-2 ">


      <div class="row">
        <div class="col">

        </div>

      </div>
      <div class="container-fluid p-0 m-0 mt-5 " style="max-width: 800px;">
        <div class="container-fluid ">
          <div class="row">
            <div class="col">
              <div class="container-fluid p-0 m-0">
                <div class="text-body-secondary " style="font-size: 0.9rem;" data-i18n="obligation.totalObligationD">
                </div>
                <div class="fs-1 fw-bold" id="totalObligationD"></div>
              </div>
            </div>
            <div class="col">
              <div class="container-fluid p-0 m-0">
                <div class="text-body-secondary " style="font-size: 0.9rem;" data-i18n="obligation.totalObligationE">
                </div>
                <div class="fs-1 fw-bold" id="totalObligationE"></div>
              </div>
            </div>
          </div>

        </div>

        <div class="row">
          <div class="col-12 xs ">
            <div class="row">
              <div class="col d-flex justify-content-end ">
                <button class="btn btn-primary rounded-3 " data-bs-toggle="modal" data-bs-target="#ajouterDetteModal"
                  data-i18n="obligation.Ajouter"></button>
              </div>
            </div>

            <div class="row" id="search-bar">
              <div class="input-group my-4">
                <span class="input-group-text " id="search-icon">
                  <i class="bi bi-search"></i>
                </span>
                <input type="text" class="form-control " placeholder="Rechercher..." aria-describedby="search-icon"
                  id="searchInput">
              </div>
            </div>
            <div class="d-flex justify-content-between justify-content-between">
              <ul class="nav nav-pills  d-flex align-items-center  gap-3 mb-5 mt-4" role="tablist">
                <li class="nav-item" role="presentation">
                  <div class=" nav-link active rounded-4  px-3 py-1" id="preter" data-bs-toggle="tab"
                    data-bs-target="#stats-pane" type="button" role="tab" aria-controls="stats-pane"
                    aria-selected="false" data-i18n="obligation.Dette">
                  </div>
                </li>
                <li class="nav-item" role="presentation">
                  <div class="nav-link rounded-4 px-3 py-1" id="emprunter" data-bs-toggle="tab"
                    data-bs-target="#profil-pane" type="button" role="tab" aria-controls="profil-pane"
                    aria-selected="true" data-i18n="obligation.Emprunt"></div>
                </li>
              </ul>
              <div class="dropdown">
                <span id="selected-filter-label" class="me-2 small text-muted"></span>
                <button class="btn border-0 dropdown-toggle" type="button" data-bs-toggle="dropdown"
                  aria-expanded="false">
                  <i class="bi bi-filter-right" id="filter"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" style="width: 120px; min-width: 100px">
                  <li>
                    <a class="dropdown-item active" aria-current="true" href="#" id="acheve"
                      data-i18n="obligation.Achevee"></a>
                  </li>
                  <li><a class="dropdown-item" href="#" id="en_cours" data-i18n="obligation.En cours"></a></li>
                  <li><a class="dropdown-item" href="#" id="Tout" data-i18n="obligation.Tous"></a></li>
                </ul>
              </div>

            </div>
            <div class="row ">
              <div class="col-12 ">

                <div class="row d-flex flex-column " id="nouveau">

                  <!-- Les obligations financieres seront inserees ici dynamiquement -->
                </div>

              </div>
            </div>
          </div>

        </div>


      </div>

    </section>
    <div class="modal fade" id="ajouterDetteModal" tabindex="-1" aria-labelledby="ajouterDetteModalLabel"
      aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content ">

          <!-- Header -->
          <div class="modal-header border-0">
            <h5 class="modal-title fw-bold" id="ajouterDetteModalLabel" data-i18n="obligation.Ajouter obligation"></h5>
          </div>

          <!-- Body -->
          <div class="modal-body">
            <form id="formAjouterDette">

              <!-- Champ propio -->
              <div class="">
                <label for="titre" class="form-label" data-i18n="obligation.Nom proprietaire"></label>
                <input type="text" class="form-control" id="nom_proprio" placeholder="Nom" required>
                <div class="invalid-feedback" data-i18n="obligation.Champ obligatoire"></div>
              </div>

              <div class="">
                <label for="type_obligation" class="form-label" data-i18n="obligation.Type obligation"></label>
                <select name="type" id="type_obligation" class="form-control" placeholder="Dette/proprietaire" required>
                  <option value="Dette" data-i18n="obligation.Dette"></option>
                  <option value="Emprunt" data-i18n="obligation.Emprunt"></option>
                </select>
                <!-- <input type="text" class="form-control" id="type_obligation" placeholder="Dette/proprietaire" required> -->
                <div class="invalid-feedback" data-i18n="obligation.Champ obligatoire"></div>
              </div>

              <!-- Champ Montant -->
              <div class="">
                <label for="montant" class="form-label" data-i18n="obligation.Montant"></label>
                <input type="number" class="form-control" id="montant" min="0" step="0.1" placeholder="0" required>
                <div class="invalid-feedback" data-i18n="obligation.Champ obligatoire"></div>
              </div>

              <!-- Champ Date d'échéance -->
              <div class="">
                <label for="dateEcheance" class="form-label" data-i18n="obligation.Date echeance"></label>
                <input type="date" class="form-control" id="dateEcheance" required>
                <div class="invalid-feedback" data-i18n="obligation.Champ obligatoire"> </div>
              </div>


              <div class="mb-3">
                <label for="description" class="form-label" data-i18n="obligation.Description"></label>
                <textarea class="form-control" id="description" rows="3"
                  placeholder="Décrivez cette obligation financière..." maxlength="500"></textarea>
                <div class="form-text text-end">
                  <span id="charCount">0</span>/500 caracteres
                </div>
                <div class="invalid-feedback" data-i18n="obligation.Champ obligatoire"></div>
              </div>


            </form>
          </div>

          <!-- Footer -->
          <div class="modal-footer border-0 d-flex align-items-center center p-3 gap-3 gap-md-5 gap-lg-5 gap-sm-5" >
            <button type="button" class="btn btn-secondary rounded-3" data-bs-dismiss="modal" style="max-width:200px;"
              data-i18n="obligation.Annuler"></button>
            <button type="button" form="formAjouterDette" id="Ajouter" class="btn btn-primary rounded-3"
              style="max-width:200px;" data-i18n="obligation.Ajouter"></button>
          </div>

        </div>
      </div>
    </div>
    <div class="modal fade" id="montantRam3" tabindex="-1" aria-labelledby="rembouserLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header border-0">
            <h5 class="modal-title fw-bold" id="rembouserLabel" data-i18n="obligation.Enregistrer un Rembourssement">
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="formRembourser">
              <div class="mb-3">
                <label for="mon" class="form-label" data-i18n="obligation.Montant versé aujourd'hui"></label>
                <input type="number" class="form-control" id="mon" min="0" step="0.1" placeholder="Ex: 5000" required
                  id="r">
              </div>
            </form>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
              data-i18n="obligation.Annuler"></button>
            <button type="button" id="validerRemboursement" class="btn btn-primary"
              data-i18n="obligation.Valider le paiement"></button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="modifier" tabindex="-1" aria-labelledby="modifierDetteModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content ">

          <!-- Header -->
          <div class="modal-header border-0">
            <h5 class="modal-title fw-bold" id="modifierDetteModalLabel" data-i18n="obligation. Ajouter obligation">
            </h5>
          </div>

          <!-- Body -->
          <div class="modal-body">
            <form id="formModifierDette1">

              <!-- Champ propio -->
              <div class="">
                <label for="titre" class="form-label" data-i18n="obligation.Nom proprietaire"></label>
                <input type="text" class="form-control" id="nom_proprio1" placeholder="Nom" required>
                <div class="invalid-feedback" data-i18n="obligation.Champ obligatoire"></div>
              </div>

              <div class="">
                <label for="type_obligation" class="form-label" data-i18n="obligation.Type obligation"></label>
                <select name="type" id="type_obligation1" class="form-control" placeholder="Dette/proprietaire"
                  required>
                  <option value="Dette" data-i18n="obligation.Dette"></option>
                  <option value="Emprunt" data-i18n="obligation.Emprunt"></option>
                </select>
                <!-- <input type="text" class="form-control" id="type_obligation1" placeholder="Dette/proprietaire" required> -->
                <div class="invalid-feedback" data-i18n="obligation.Champ obligatoire"></div>
              </div>

              <!-- Champ Montant -->
              <div class="">
                <label for="montant" class="form-label" data-i18n="obligation.Montant"></label>
                <input type="number" class="form-control" id="montant1" min="0" step="0.1" placeholder="0" required>
                <div class="invalid-feedback" data-i18n="obligation.Champ obligatoire"></div>
              </div>

              <!-- Champ Date d'échéance -->
              <div class="">
                <label for="dateEcheance" class="form-label" data-i18n="obligation.Date echeance"></label>
                <input type="date" class="form-control" id="dateEcheance1" required>
                <div class="invalid-feedback" data-i18n="obligation.Champ obligatoire"></div>
              </div>

              <div class="mb-3">
                <label for="description" class="form-label" data-i18n="obligation.Description"></label>
                <textarea class="form-control" id="description1" rows="3"
                  placeholder="Décrivez cette obligation financière..." maxlength="500"></textarea>
                <div class="form-text text-end">
                  <span id="charCount">0</span>/500 caractères
                </div>
                <div class="invalid-feedback" data-i18n="obligation.Champ obligatoire"></div>
              </div>


            </form>
          </div>

          <!-- Footer -->
          <div class="modal-footer border-0 d-flex align-items-center center p-3 gap-3 gap-md-5 gap-lg-5 gap-sm-5">
            <button type="button" class="btn btn-secondary rounded-3" data-bs-dismiss="modal" style="max-width:200px;"
              id="annuler1" data-i18n="obligation.Annuler"></button>
            <button type="button" form="formModifierDette1" id="modify" class="btn btn-primary rounded-3"
              style="max-width:200px;" data-i18n="obligation.Modifier"></button>
          </div>

        </div>
      </div>
    </div>

    <div class="modal fade " id="decrit" tabindex="-1" aria-labelledby="DescriptionModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content ">

          <!-- Header -->
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="stat"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="close" id="annuler">
            </button>
          </div>

          <!-- Body -->
          <div class="modal-body">
            <div class="">

              <div class="container ">

                <div class="row g-0">
                  <div class="col pb-2" data-i18n="obligation.Montant"></div>
                  <div id='montant-modal' class="col pb-2">

                  </div>


                </div>
                <div class="row g-0">
                  <div class="col pb-2" data-i18n="obligation.Nom proprietaire"></div>
                  <div class="col pb-2" id="pro">

                  </div>
                </div>
                <div class="row g-0">
                  <div class="col pb-2" data-i18n="obligation.Date limite"></div>
                  <div class="col pb-2" id="dateL">

                  </div>
                </div>
                <div class="row g-0">
                  <div class="col pb-2" data-i18n="obligation.Date de dette"></div>
                  <div class="col pb-2" id="DateDt">

                  </div>
                </div>
                <div class="row g-0">
                  <div class="col pb-3" data-i18n="obligation.Description"></div>

                </div>
                <div class="col fw-bold" id="dd">

                </div>
              </div>

            </div>
          </div>


          <!-- Footer -->
          <div class="modal-footer d-flex align-items-center center p-3 gap-3 gap-md-5 gap-lg-5 gap-sm-5">
            <button type="button" class="btn btn-secondary rounded-3" style="max-width:200px;" id="Annuler"
              data-bs-dismiss="modal" data-i18n="obligation.Annuler"></button>
            <button type="button" form="formModifierDette" data-bs-toggle="modal" data-bs-target="#modifier"
              class="btn btn-primary rounded-3" style="max-width:200px;" data-i18n="obligation.Modifier" id="mod"></button>
          </div>

        </div>
      </div>
    </div>


  </main>

  <script type="module" src="/src/main.js"></script>
  <script type="module" src="../static/js/essai2.js"></script>
  <script type="module" src="../static/js/PageController/ObligationController.js"></script>

</body>



</html>
