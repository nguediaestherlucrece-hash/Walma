<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">





    <link rel="stylesheet" href="../static/css/style.css">
    <script type="module" src="/src/main.js"></script>

    <script type="module" src="../static/js/PageController/dashboardController.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Dashboard</title>
</head>

<body class="d-flex flex-nowrap ">

    <!-- Barre de navigation verticale -->
    <header class="d-none d-lg-flex flex-column flex-shrink-0 p-3  bg-body-tertiary" style="width: 300px">

    </header>



    <!-- Espace de travail -->
    <main class="container-fluid flex-grow-1 bg-body-secondary overflow-auto pe-3 ps-3 ">


        <!-- Barre d'acces rapide -->
        <section id="work-header"
            class="row position-sticky top-0  pt-2  pb-2 ps-md-2 pe-md-2  z-1  g-0 bg-body-secondary">
            <div class="col  justify-content-between   d-flex flex-row align-items-center p-0">
                <nav class="col d-flex flex-row gap-4 align-items-center  justify-content-start">
                    
                </nav>

            </div>
        </section>
         <span class="fs-4 fw-medium" >Dashboard</span>
        <!--  votre espace -->
        <section id="welcome" class="row g-0 pb-2 pt-4">
            <h1 id="z-welcome" class="p-0 m-0" data-i18n="dashboard.bienvenue"></h1>

        </section>

        <!-- Zone 2 -->
        <section class="row  g-0 pt-2 ">
            <div class="col col-xl-8 col-xxl-9  ">
                <!-- Ligne d'affichage des statistiques generales -->
                <div class="row g-0 ">
                    <div class="col-12 ps-0 pe-0 pt-3 pb-3   d-flex g-0 ">
                        <div class="row  w-100 g-0">
                            <div class="col d-flex flex-column flex-xxl-row gap-2 ">
                                <div class="col col-xxl-5 h-100">
                                    <div
                                        class="container-fluid m-0 p-0 d-flex flex-column justify-content-xxl-center gap-2 g-0  h-100">
                                        <!-- cadre d'afficahe du solde -->
                                        <div class="row g-0 h-100">
                                            <div
                                                class="h6 m-0 p-0 fw-light d-flex align-items-start justify-content-start card  rounded-2 ps-4 p-2 text-start">
                                                <h6 class=" mb-2"><i
                                                        class="bi bi-lightbulb-fill text-orange me-3" ><span class="ms-3 fst-normal text-body " data-i18n="dashboard.conseilDuJour">merde</span></i>
                                                    
                                                </h6>
                                                <p id="z-conseil-jour" class="pt-2">
                                                   
                                                </p>

                                            </div>
                                        </div>

                                    </div>
                                </div>


                                <div class="container-fluid m-0 p-0">
                                    <!-- cadre d'afficahe du revenu -->
                                    <div class="row   w-100 g-0 mb-2">
                                        <div class="col ">
                                            <div class="row  g-0">
                                                <div class="col-6">
                                                    <div id="solde-card"
                                                        class="card rounded-2 d-flex flex-column gap-1  justify-content-around align-items-start p-2 pt-2 pb-0 me-1">
                                                        <div class=" d-flex flex-row align-items-center  gap-2 me-2 "
                                                            style="width: fit-content;">
                                                            <i
                                                                class="bi bi-currency-dollar fs-6  rounded-circle card p-2 border-orange text-orange "></i>
                                                            <span id="z-label-solde" class="fs-6 " data-i18n= "dashboard.soldeLabel"></span>
                                                        </div>
                                                        <div
                                                            class="col d-flex  flex-row  w-100 justify-content-end gap-4  ">
                                                            <h6 id="z-valeur-solde"
                                                                class="  d-sm-block d-xl-flex d-xxl-bloc text-sm-end fw-semibold text-truncate">
                                                                </h6>
                                                            <span id="z-evolution-solde"
                                                                class=" d-sm-block d-xl-flex d-xxl-bloc text-end"></span>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-6 ">
                                                    <div id="solde-card"
                                                        class=" card  rounded-2 d-flex gap-1 flex-column justify-content-around align-items-start p-2 pt-2 pb-0 ms-1">
                                                        <div class=" d-flex flex-row align-items-center  gap-2 me-2 "
                                                            style="width: fit-content;">

                                                            <i
                                                                class="bi bi-arrow-left-rightl fs-6  rounded-circle card p-2 border-orange text-orange "></i>
                                                            <span id="z-label-epargne" class="fs-6" data-i18n="dashboard.epargne"></span>
                                                           
                                                        </div>
                                                        <div
                                                            class="col d-flex  flex-row  w-100 justify-content-end gap-4 ">
                                                            <h6 id="z-valeur-epargne"
                                                                class="  d-sm-block d-xl-flex d-xxl-bloc text-sm-end fw-semibold text-truncate">
                                                                </h6>
                                                            <span id="z-evolution-epargne"
                                                                class=" d-sm-block d-xl-flex d-xxl-bloc text-end"></span>
                                                        </div>
                                                    </div>
                                                </div>

                                            </div>

                                        </div>
                                    </div>
                                    <div class="row w-100  g-0">
                                        <div class="col-6 ">

                                            <div class="container-fluid  pe-1  m-0 p-0">
                                                <div id="revenu-card "
                                                    class="card h-100  rounded-2 d-flex flex-column justify-content-between  align-items-center p-2 pb-0  ">
                                                    <div
                                                        class="col-12 g-0 d-flex  flex-column h-100 justify-content-between">
                                                        <div class="row g-0 gap-2   w-100">
                                                            <div
                                                                class="col-12 g-0 d-flex flex-row   align-items-center gap-2">
                                                                <i
                                                                    class="bi bi-graph-up fs-6  rounded-circle p-2 card text-green border-green"></i>
                                                                <span class="fs-6" data-i18n="dashboard.revenu"></span>
                                                            </div>
                                                            <div
                                                                class="col d-flex gap-4 flex-row justify-content-end w-100">
                                                                <h6 id="z-valeur-revenu" class="fw-semibold text-truncate"></h6>
                                                                <span id="z-evolution-revenu"
                                                                    class="  d-xl-flex  text-end"></span>
                                                            </div>
                                                        </div>


                                                    </div>
                                                </div>

                                            </div>
                                        </div>
                                        <div class="col-6 ">
                                            <div class="container-fluidm-0 p-0 ps-1 ">
                                                <div id="depense-card"
                                                    class="card h-100 rounded-2 d-flex flex-column  align-items-center p-2 pb-0  ">
                                                    <div
                                                        class="col-12  gap-0 justify-content-between d-flex flex-column  h-100">
                                                        <div class="row  g-0  gap-2">
                                                            <div
                                                                class="col-12 d-flex flex-row   align-items-center gap-2">
                                                                <i
                                                                    class="bi bi-graph-down fs-6  rounded-circle card p-2 border-red text-red"></i>
                                                                <span class="fs-6" data-i18n="dashboard.depense"></span>
                                                            </div>
                                                            <div
                                                                class="col d-flex gap-4 flex-row justify-content-end w-100">
                                                                <h6 id="z-valeur-depense" class="fw-semibold fs-6 text-truncate"></h6>
                                                                <span id="z-evolution-depense"
                                                                    class="  d-xl-flex  text-end"></span>
                                                            </div>
                                                        </div>



                                                    </div>
                                                </div>

                                            </div>

                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class=" row g-0 ">
                    <div class="h4 mt-3 mt-xxl-4 mb-4" data-i18n="dashboard.metrique"></div>
                    <div class="col d-flex flex-column gap-3 gap-xxl-0 flex-xxl-row">
                        <div class="col-12 col-xxl-8    ">
                            <!-- Graphe prinicipal -->

                            <div id="card-main-graph" class="card rounded-2  p-3">
                                <div class="row d-flex flex-column ">
                                    <div class="dropdown mb-4">
                                        <button id="btn-switch-chart"
                                            class="btn btn-outline-primary dropdown-toggle btn-sm rounded-3"
                                            type="button" data-bs-toggle="dropdown" aria-expanded="false" data-i18n="dashboard.dropdownRevenu">
                                            
                                        </button>
                                        <ul class="dropdown-menu">
                                            <li>
                                                <a class="dropdown-item option-graph" href="#" data-i18n="dashboard.dropdownRevenu"></a>
                                            </li>
                                            <li><a class="dropdown-item option-graph" href="#" data-i18n="dashboard.dropdownDepense"></a></li>
                                            <li>
                                                <a class="dropdown-item option-graph" href="#" data-i18n="dashboard.dropdownEpargne"></a>
                                            </li>
                                            
                                        </ul>
                                    </div>
                                </div>
                                <canvas id="myChart1">
                                </canvas>
                            </div>
                        </div>


                        <div class="col-12 col-xxl-4 ps-xxl-3">
                            <!-- Cadre du graphe de repartition des depenses -->
                            <div id="card-partition-depense" class="card   rounded-2 d-flex flex-column h-100 pb-4"
                                style="max-height:500px;">
                                <div class="row">
                                    <h5 class="text-center mt-3 text-secondary-emphasis" data-i18n="dashboard.labalRepartitionDepense"></h5>
                                </div>
                                <div class="row w-100 h-100 g-0">
                                    <canvas id="myChart2" style="max-height: 350px;">
                                    </canvas>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
            <div class="col-xl-4 col-xxl-3   d-xl-flex flex-column pt-3 ps-0 ps-xl-4 ">
                <div class="row mt-3 mt-xl-0">
                    <div class="col   mb-4 d-flex flex-column justify-content-start">
                        
                        <!-- Cadre des objectifs -->
                        <div id="card-objectif" class="card rounded-2 p-2">
                            <div class="row ">
                                <div class="col d-flex flex-row m-2 mt-3 justify-content-between align-items-center">
                                    <div>
                                        <i class="bi bi-trophy me-3 " ><span class="ms-2 fst-normal" data-i18n="dashboard.labelObjectif"></span></i>
                                    </div>
                                    <div>
                                        <button class="btn btn-primary btn-sm rounded-3" data-i18n="dashboard.objectifSeeMore" id="btnObjectif"></button>
                                    </div>
                                </div>

                            </div>
                            <div class="row">
                                <div class="col-auto ms-2 me-2">
                                    <div id="z-intitule-obj" class="m-0 p-0"></div>
                                    <div id="z-date-echeance-obj" class="text-end m-0 p-0 text-dark-emphasis"
                                        style="font-size: 0.7rem;">
                                    </div>
                                </div>
                            </div>
                            <div id="z-epargne-actuelle-obj" class="ms-2 me-2 mt-3 mb-1"></div>
                            <div class="progress m-2" role="progressbar" aria-label="Basic example" aria-valuenow="56"
                                aria-valuemin="0" aria-valuemax="100" style="height: 7px;">

                                <div id="progress-obj" class="progress-bar" style="width: 56%;"></div>
                            </div>
                            <div class="col m-2 d-flex justify-content-between align-items-center">
                                <div id="z-pourcentage-obj" class="fs-4"></div>
                                <div id="z-a-epargner-obj"></div>
                            </div>
                        </div>
                        <!-- Evenements recents -->
                    </div>

                </div>



                <div class="card rounded-2 ps-3 p-2 mt-3">
                    <div class="h6 mt-1 mb-3 " data-i18n="dashboard.recemment"></div>
                    <div id="card-recent-events">

                    </div>
                </div>
            </div>
        </section>

        <!-- fin de votre espace -->
    </main>

</body>



</html>
