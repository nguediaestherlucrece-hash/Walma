<!DOCTYPE html>
<html lang="en" >

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css"> -->


    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Parametres</title>
</head>

<body class="d-flex flex-nowrap ">

    <!-- Barre de navigation verticale -->
    <header class="d-none d-lg-flex flex-column flex-shrink-0 p-3  bg-body-tertiary" style="width: 300px">
    </header>

    <!-- Espace de travail -->
    <main class="container-fluid flex-grow-1 bg-body-secondary overflow-auto pe-3 ps-3 ">
        <!-- Barre d'acces rapide -->
        <section id="work-header"
            class="row position-sticky top-0  pt-2  pb-2 ps-md-2 pe-md-2  z-1  g-0 bg-body-secondary">

            <div class="col  justify-content-between   d-flex flex-row align-items-center p-0">

                <nav class="col d-flex flex-row gap-4 align-items-center  justify-content-start">

                   
                   
                   
                </nav>
                
                
            </div>
        </section>

        <!-- profil -->
        <section class="row g-0">
            <div class="col d-flex flex-column align-items-center ">
                <div class=" p-4 pt-2 pb-2" style="max-width: 800px;width: 100%;">
                    <div class="mb-1" data-i18n="parametre.labelTheme"></div>
                    <div class="mb-3 text-body-tertiary" data-i18n="parametre.themeIndication"></div>
                    <div class="row gap-3 mb-5">
                        <div class=" col form-check">
                            <input class="form-check-input " type="radio" name="radioDefault" id="radioDefault2" data-bs-theme-value="auto">
                            <label class="form-check-label " for="radioDefault2">
                                <img class="img-fluid " src="/assets/images/auto.webp">
                            </label>
                            <div class="text-body-tertiary mt-2" data-i18n="parametre.indicationDefaultTheme"></div>
                        </div>
                        <div class="col form-check  ">
                            <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1" data-bs-theme-value="light">
                            <label class="form-check-label" for="radioDefault1">
                                <img class="img-fluid" src="/assets/images/light.webp">
                            </label>
                             <div class="text-body-tertiary mt-2" data-i18n="parametre.indicationClairTheme"></div>
                        </div>
                        <div class="col form-check ">
                            <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault3"  data-bs-theme-value="dark" checked>
                            <label class="form-check-label" for="radioDefault3">
                                <img class="img-fluid" src="/assets/images/dark.webp">
                            </label>
                             <div class="text-body-tertiary mt-2" data-i18n="parametre.indicationSombreTheme"></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div data-i18n="parametre.labelLanguage"></div>
                        <div class="d-flex justify-content-between  align-items-center">
                            <div class="text-body-tertiary" data-i18n="parametre.langageIndication"></div>
                            <select class="form-select w-auto" id="selectLang" aria-label="Default select example" style="height: fit-content;">
                                <option data-i18n="parametre.englishOption" value="en"></option>
                                <option data-i18n="parametre.frenchOption" value="fr"></option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/static/js/PageController/parametreController.js"></script>



</body>



</html>
