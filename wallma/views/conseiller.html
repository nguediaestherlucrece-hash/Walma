<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script type="module" src="/src/main.js"></script>
       


        <script type="module" src="/static/js/PageController/conseillerController.js"></script>
    <title>Conseiller</title>
</head>

<body class="d-flex flex-nowrap bg-light">

    <!-- Barre de navigation verticale -->
    <header class="d-none d-lg-flex flex-column bg-body-tertiary flex-shrink-0 p-3 "
        style="width: 300px; height: 100%;">

    </header>



    <!-- Espace de travail -->
    <main class="flex-grow-1 overflow-auto min-vh-100  bg-body-secondary d-flex flex-column">
        <!-- Barre d'acces rapide -->
        <section id="work-header"
            class="row position-sticky top-0  pt-2  pb-2 ps-md-2 pe-md-2  z-1  g-0 bg-body-secondary">

            <div class="col  justify-content-between   d-flex flex-row align-items-center p-0">

                <nav class="col d-flex flex-row gap-4 align-items-center  justify-content-start">

                   
                    <!-- Menu invisible -->
                    
                </nav>
                <div class="dropdown">
                        <button id="btn-conversation" class="btn border-0 btn-sm" type="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            <i class="bi bi-clock-history card p-2"></i>
                        </button>
                        <ul id="z-recent-conversation" class="dropdown-menu dropdown-menu-end" style="width: 300px;min-width:100px;">
                           
                            

                        </ul>
                    </div>
               
            </div>
            <span class="fs-4 fw-medium" data-i18n="sideBar.linkConseiller"></span>
        </section>
        

        <section class="container-fluid  flex-grow-1  g-0 d-flex flex-column h-100 p-0 m-0 ps-3 pe-3 position-relative">
           
             
            <div class="row h-100 g-0">
                <div class="col-12 d-flex align-items-center justify-content-center g-0 h-100 ">
                    <div class="container-fluid h-100  p-0 m-0  d-flex flex-column align-items-center  justify-content-between "
                        style="max-width: 650px;">
                        <div id="affichage"
                            class="container flex-grow-1  d-flex flex-column justify-content-center  mb-5 m-0 p-0 ">
                            <div class="text-center h1" data-i18n="conseiller.hello"></div>
                        </div>
                        <div class="position-sticky bottom-0  position-relative  w-100  bg-body-secondary "
                            style="min-height: 120px;">
                            <div
                                class="input-group  d-flex w-100 position-absolute bottom-50 card rounded-2 border-2 flex-column  p-2 justify-content-end">
                                <textarea name="message" id="message" class="position-sticky  flex-grow-1 bottom-100 w-100"
                                    style="background-color:transparent;border: none;outline: none;resize: none;overflow-y: auto;min-height: 30px;max-height: 150px;"
                                    rows="1">
                                </textarea>
                                <div class="col d-flex  flex-row justify-content-end  pt-1 pb-1">
                                    <i id="btn-send"
                                        class="bi bi-arrow-up  btn btn-primary rounded-circle fs-4 d-flex align-items-center justify-content-center z-3 d-none"
                                        style="width: 40px;height: 40px;"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>


            </div>




        </section>
        
    </main>

</body>



</html>
